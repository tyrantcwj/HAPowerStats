name: Mirror to Gitee

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "未配置 GITEE_TOKEN，跳过同步"
            exit 1
          fi
          git remote remove gitee 2>/dev/null || true
          git remote add gitee "https://tyrantcwj:${GITEE_TOKEN}@gitee.com/tyrantcwj/HAPowerStats.git"
          git push --force --tags gitee "HEAD:refs/heads/main"
