services:
  electricity-monitor:
    build: .
    image: hapowerstats:latest
    container_name: hapowerstats
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./data/electricity_data:/app/electricity_data
      - ./data/config:/app/config
    environment:
      - TZ=Asia/Shanghai
      - CONFIG_DIR=/app/config
      - DATA_DIR=/app/electricity_data
      - WEB_PASSWORD=${WEB_PASSWORD:-}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-}
    networks:
      - monitor-network

networks:
  monitor-network:
    driver: bridge
