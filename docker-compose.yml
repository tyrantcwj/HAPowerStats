services:
  electricity-monitor:
    # 默认拉取已构建镜像，避免每次在国内重新下载 Python 基础镜像和 pip 依赖
    # 加速站失效时，可依次换成：
    #   ghcr.m.daocloud.io/tyrantcwj/hapowerstats:latest
    #   ghcr.io/tyrantcwj/hapowerstats:latest
    image: ghcr.1ms.run/tyrantcwj/hapowerstats:latest
    container_name: electricity-monitor
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./data/electricity_data:/app/electricity_data
      - ./data/config:/app/config
    environment:
      - TZ=Asia/Shanghai
    networks:
      - monitor-network

networks:
  monitor-network:
    driver: bridge
