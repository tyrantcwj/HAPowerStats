services:
  electricity-monitor:
    build:
      context: .
      args:
        # 国内构建加速。若镜像站失效，可改成 docker.1ms.run/library/python:3.11-slim
        BASE_IMAGE: docker.m.daocloud.io/library/python:3.11-slim
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
        APT_MIRROR: mirrors.aliyun.com
    image: electricity-monitor:latest
    container_name: electricity-monitor
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # 持久化数据目录
      - ./data/electricity_data:/app/electricity_data
      # 配置文件目录（可选，方便直接编辑配置）
      - ./data/config:/app/config
    environment:
      - TZ=Asia/Shanghai
    networks:
      - monitor-network

networks:
  monitor-network:
    driver: bridge
